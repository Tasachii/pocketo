name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิก run เก่าที่ยังค้างของ ref เดียวกันเมื่อ push ใหม่ (กันคิวสะสม)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # fail เร็วถ้าเทสต์ค้าง — ไม่ปล่อยชน 6 ชม. ตามเพดาน GitHub
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Base-path casing guard
        run: npm run check-base
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E + accessibility
        run: npm run test:e2e
